<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>

    <style>
        img{
            width: 100px;
        }
        table, tr, td{
            border: 1px solid;
        }
        label{
            display: block;
        }
        #form-login{
            background-color: bisque;;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            border-radius: 10px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <h1>Lista de Produtos</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Preço</th>
        </tr>

        <tr>
            <td>01</td>
            <td>Celular</td>
            <td>R$ 1500,00</td>
        </tr>

        <tr>
            <td>02</td>
            <td>Notebook</td>
            <td>R$ 3550,00</td>
        </tr>

        <tr>
            <td>03</td>
            <td>Kindle</td>
            <td>R$ 300,00</td>
        </tr>
    </table>

    <table>
        <tr>
            <th>Produto</th>
            <th>Preço</th>
        </tr>

        <tr>
            <td><img src="https://i.dell.com/is/image/DellContent/content/dam/images/products/laptops-and-2-in-1s/dell-laptop/db14250-non-touch/dell-db14250nt-laptop-c-22040rf115-bl-fpr.psd?wid=1200&hei=630&fmt=png-alpha" alt="" srcset=""></td>
            <td>R$ 1680,00</td>
        </tr>
    </table>

    <div id="form-login">
        <form>
            <label>Login</label>
            <input type="text" placeholder="Usuário">
            <label>Senha</label>
            <input type="password" placeholder="Senha">
        </form>
    </div>    
</body>
</html>
